name: Publish QURS Shinylive on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Shiny_App/**"
      - ".github/workflows/build-shinylive.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install R and Shinylive from Posit GitHub
        uses: rstudio/shiny-workflows/setup-r-package@v1
        with:
          packages: |
            renv
            posit-dev/r-shinylive
            sessioninfo

      - name: Install Shiny app dependencies
        shell: Rscript {0}
        run: |
          pak::pak(unique(renv::dependencies("Shiny_App")$Package))
          stopifnot(requireNamespace("shinylive", quietly = TRUE))

      - name: Export QURS Shiny app
        shell: Rscript {0}
        run: |
          shinylive::export("Shiny_App", "site")
          stopifnot(file.exists("site/index.html"))

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
