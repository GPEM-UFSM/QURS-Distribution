name: Publish QURS Shinylive on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Shiny_App/**"
      - ".github/workflows/build-shinylive.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Shinylive export package
        shell: Rscript {0}
        run: |
          options(repos = c(
            posit = "https://posit-dev.r-universe.dev",
            CRAN = "https://cloud.r-project.org"
          ))
          install.packages("shinylive", dependencies = c("Depends", "Imports", "LinkingTo"))
          if (!requireNamespace("shinylive", quietly = TRUE)) {
            stop("Could not install the shinylive package")
          }
          packageVersion("shinylive")

      - name: Export QURS Shiny application to docs
        shell: Rscript {0}
        run: |
          shinylive::export(appdir = "Shiny_App", destdir = "docs")
          stopifnot(file.exists("docs/index.html"))

      - name: Disable Jekyll
        run: touch docs/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
