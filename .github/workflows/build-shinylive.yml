name: Build QURS Shinylive site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Shiny_App/**"
      - ".github/workflows/build-shinylive.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Shinylive exporter
        shell: Rscript {0}
        run: |
          install.packages("shinylive", repos = "https://cloud.r-project.org")

      - name: Export Shiny application for GitHub Pages
        shell: Rscript {0}
        run: |
          shinylive::export(appdir = "Shiny_App", destdir = "docs")

      - name: Save generated site to docs
        shell: bash
        run: |
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to generated site."
          else
            git commit -m "Build QURS Shinylive GitHub Pages site [skip ci]"
            git push
          fi
